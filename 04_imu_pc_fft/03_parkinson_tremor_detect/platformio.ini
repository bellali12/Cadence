; PlatformIO project - Parkinsonian tremor detection
; Project description: README.md
; Technical report: RESEARCH.md
; Pin reference: ../../硬件物料与引脚分配.md
; Libraries: rfetick/MPU6050_light (IMU) + kosme/arduinoFFT (frequency-domain analysis)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_type = qio
board_upload.flash_size = 16MB

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Use native USB for serial communication

lib_deps =
    rfetick/MPU6050_light @ ^1.1.0
    kosme/arduinoFFT @ ^2.0

monitor_speed = 115200
upload_speed = 921600
