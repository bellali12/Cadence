; PlatformIO project - Raw IMU data + PC-side FFT analysis
; Project description: README.md
; Pin reference: ../../硬件物料与引脚分配.md (actual wiring uses GPIO18/17)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_type = qio
board_upload.flash_size = 16MB

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Use native USB for serial communication (GPIO19/20 occupied)

lib_deps =
    rfetick/MPU6050_light @ ^1.1.0

monitor_speed = 115200
upload_speed = 921600
