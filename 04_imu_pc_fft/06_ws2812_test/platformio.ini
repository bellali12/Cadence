; PlatformIO project - WS2812 LED test (9 LEDs)
; Project description: README.md
; Pin reference: ../../硬件物料与引脚分配.md (LED_DIN = GPIO6, finalized)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_type = qio
board_upload.flash_size = 16MB

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Use native USB for serial communication (GPIO19/20 occupied)

lib_deps =
    fastled/FastLED @ ^3.6.0

monitor_speed = 115200
upload_speed = 921600
