; PlatformIO project - NS4168 amplifier square-wave test
; Project description: README.md
; Purpose: use a generated square wave to test the I2S1 -> NS4168 -> speaker signal path (independent of microphone/recording)
; Pins: BCLK=GPIO41, LRC=GPIO42, DIN=GPIO2 (finalized project pinout)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_type = qio
board_upload.flash_size = 16MB

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed = 921600
