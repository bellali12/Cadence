; PlatformIO Project - Audio loopback test (record 10 s with microphone → play through speaker)
; Project documentation: README.md
; Pin assignments source: ../../硬件物料与引脚分配.md

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Enable 8 MB OPI PSRAM (store recording buffer in PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.flash_type = qio
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Use native USB for serial communication (GPIO19/20 are occupied)

monitor_speed = 115200
upload_speed = 921600
