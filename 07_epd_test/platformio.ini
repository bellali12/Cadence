; PlatformIO project - GDEM0097F51 color e-paper display test
; Project description: README.md
; Library source: ../../screen_arduino/ (official example already adapted for ESP32-S3)
; Pins (from the tested screen_arduino version): SCK=GPIO12 MOSI=GPIO11 CS=GPIO10 DC=GPIO9 RST=GPIO13 BUSY=GPIO14
;   SCK=GPIO12  MOSI=GPIO11  CS=GPIO10  DC=GPIO9  RST=GPIO13  BUSY=GPIO14

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_type = qio
board_upload.flash_size = 16MB

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Use native USB for serial communication (GPIO19/20 occupied)

; No lib_deps: SPI.h is included with the Arduino framework

monitor_speed = 115200
upload_speed = 921600
