; PlatformIO project - dual capacitive touch-button test
; Project description: README.md
; Pin reference: ../../硬件物料与引脚分配.md (Section 3.5)
; T1 = GPIO1 (confirmation button)
; T4 = GPIO4 (box-opening button)
; API: Arduino touchRead() (same as final firmware; no extra dependencies)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_type = qio
board_upload.flash_size = 16MB

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Native USB serial (GPIO19/20 used by USB)

monitor_speed = 115200
upload_speed = 921600
