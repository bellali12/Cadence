; PlatformIO project - final smart medication case firmware
; Project description: README.md
; Integrates modules 01-07: e-paper, amplifier, WS2812, touch buttons, LittleFS WAV audio

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi    ; Enable OPI PSRAM (from module 01)
board_build.flash_type = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv      ; Custom partition table (3 MB app + 1.5 MB LittleFS)
board_build.filesystem = littlefs            ; LittleFS filesystem (faster and more compact than SPIFFS)

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Native USB serial (GPIO19/20 used by USB)
    ; ===== Wi-Fi reporting settings (must update before flashing) =====
    -DWIFI_SSID=\"YOUR_WIFI_NAME\"
    -DWIFI_PASS=\"YOUR_WIFI_PASSWORD\"
    -DPC_SERVER_IP=\"192.168.1.100\"
    -DPC_SERVER_PORT=5000
    -DDEVICE_ID=\"pillbox_01\"

lib_deps =
    fastled/FastLED @ ^3.6.0        ; WS2812 LEDs (from module 06)
    bblanchon/ArduinoJson @ ^7.1.0  ; JSON serialization (event reporting)
    rfetick/MPU6050_light @ ^1.1.0  ; MPU6050 IMU driver (from modules 02/03/04)
    kosme/arduinoFFT @ ^2.0         ; FFT for tremor detection (from module 03)
    ; LittleFS is bundled with Arduino ESP32 (<LittleFS.h>); no external library needed

monitor_speed = 115200
upload_speed = 921600
